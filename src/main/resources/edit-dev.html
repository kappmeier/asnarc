<!DOCTYPE html>
<html lang="en">
<head>
  <title>Asnarc Editor</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <link rel="stylesheet" type="text/css" href="asnarc.css"/>
  <link rel="stylesheet" type="text/css" href="editor.css"/>
</head>
<body>

<div class="topbar">
  <div class="input-wrapper">
    <label for="levelSelect">Level:</label>
    <select id="levelSelect" class="asnarc-input"></select>
  </div>
  <div class="input-wrapper">
    <label for="blockSize">Block Size:</label>
    <input type="number" id="blockSize" class="asnarc-input" value="20" min="5" max="30" style="width: 70px">
  </div>
  <button id="applyButton" class="asnarc-button">Apply</button>
</div>

<div class="asnarc-container">
    <div class="asnarc-canvas-container">
        <canvas id="canvas" width="600" height="600" tabindex="1"></canvas>
    </div>
    <div id="edit" class="editor-details-container">
        <div id="canvas-details"></div>
    </div>
</div>

<script type="text/javascript" src="../asnarc-fastopt/main.js"></script>
<script>
    // Fill level selection dropdown
    const levels = PredefinedLevels.availableLevels();
    const select = document.getElementById('levelSelect');
    levels.forEach(function(level) {
        const option = document.createElement('option');
        option.value = level;
        option.text = level;
        select.appendChild(option);
    });

    // Set default selection to 'Small'
    select.value = 'Small';

    function startEditor() {
        const level = select.value;
        const blockSize = parseInt(document.getElementById('blockSize').value) || 20;
        AsnarcJSEditor.main(
            document.getElementById('canvas'),
            document.getElementById('canvas-details'),
            level,
            blockSize
        );
    }

    // Start editor initially
    startEditor();

    // When a new level is selected, reload the editor
    select.addEventListener('change', startEditor);

    // Apply button for block size changes
    document.getElementById('applyButton').addEventListener('click', startEditor);
</script>
</body>
</html>
