<!DOCTYPE html>
<html>
<head>
  <title>Asnarc Editor</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <link rel="stylesheet" type="text/css" href="editor.css"/>
</head>
<body style="margin: 0px">

<div class="editor-container">
    <div class="editor-canvas-container">
        <canvas id="canvas" width="600" height="600" tabindex="1"></canvas>
    </div>
    <div id="edit" class="editor-details-container">
        <div id="canvas-details"></div>
    </div>
</div>

<script type="text/javascript" src="../asnarc-fastopt/main.js"></script>
<script>
    AsnarcJSEditor.main(document.getElementById('canvas'), document.getElementById('canvas-details'), 'Small', 20);
</script>
</body>
</html>
